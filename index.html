<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17406b">
<title>بوابة الانطلاق</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#edf1f4;--card:#fff;--ink:#12202c;--mute:#5d6b78;--line:#d5dde4;--accent:#17406b;--accent-ink:#fff;--go:#f2b01e;--go-ink:#1d1500;--ok:#1b7f4b;--okbg:#ddf2e6;--bad:#b83227;--badbg:#fbe3e0;--warn:#8a5a00;--warnbg:#fdf0d0;--st-learn:#d9a441;--st-strong:#3f8fb0;--st-master:#1b7f4b;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0d1620;--card:#15222f;--ink:#e8eef3;--mute:#9fb0be;--line:#27384a;--accent:#f5b83d;--accent-ink:#1d1500;--go:#f5b83d;--go-ink:#1d1500;--ok:#4cc27d;--okbg:#15382a;--bad:#ef7365;--badbg:#3c1f1b;--warn:#e8b04d;--warnbg:#3a2c10;--st-learn:#e0a548;--st-strong:#5ab0d4;--st-master:#4cc27d}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.55rem;margin:6px 0 0;font-weight:800;letter-spacing:0}
h2{font-size:1.02rem;margin:14px 0 6px;font-weight:700}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.mute{color:var(--mute);font-size:.92rem}
.warnbox,.okbox{border-radius:var(--r);padding:10px 12px;margin:12px 0;font-size:.95rem}
.warnbox{background:var(--warnbg);color:var(--warn)}
.okbox{background:var(--okbg);color:var(--ok)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.btn{display:block;width:100%;min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-size:1.05rem;padding:10px 14px;margin-top:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.go{background:var(--go);color:var(--go-ink);border-color:var(--go);font-weight:800}
.btn.small{min-height:44px;font-size:.98rem}
.btn:disabled{opacity:.55;cursor:default}
input[type=password],select,.ta{width:100%;min-height:46px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);padding:10px;margin-top:8px}
input[type=password]{direction:ltr;font-size:.9rem}
select{width:auto;min-width:96px;margin-inline-end:8px}
.ta{min-height:120px;resize:vertical;font-size:.95rem}
.code{direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;min-height:84px;resize:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.tile .num{font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:.8rem;color:var(--mute);line-height:1.35}
.ring{--p:0;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.82rem;font-variant-numeric:tabular-nums}
.pass{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.pass .main{flex:1;min-width:0;padding:16px}
.pass .stub{position:relative;width:118px;flex:none;border-inline-start:2px dashed var(--line);padding:14px 10px;display:flex;flex-direction:column;justify-content:center;background:var(--bg)}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;inset-inline-start:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass .stub::before{top:-11px}.pass .stub::after{bottom:-11px}
.pass .stub .btn{margin-top:0;min-height:64px;line-height:1.3}
.pass .kick{font-size:.82rem;color:var(--mute)}
.pass .line{font-size:1rem;margin-top:2px}
.pass .line b{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;margin-inline-end:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--card);min-height:38px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.stack i{display:block;min-width:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:12px;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.strip{display:flex;gap:4px;align-items:flex-end;height:70px;direction:ltr;margin-top:8px}
.strip i{flex:1;border-radius:4px 4px 0 0;background:var(--accent);opacity:.35;min-height:4px}
.strip i.hit{opacity:1}
details>summary{cursor:pointer;font-weight:700;min-height:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.top button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;min-height:40px}
.badge{font-size:.9rem;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:var(--accent)}
.bar i.low{background:var(--bad)}
.prompt{text-align:center;padding:24px 12px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.en{font-size:2.15rem;font-weight:700;direction:ltr;unicode-bidi:isolate;word-break:break-word}
.ar{font-size:1.75rem;font-weight:700}
.tag{font-size:.8rem;background:var(--warnbg);color:var(--warn);border-radius:20px;padding:2px 10px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{min-height:58px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);font-size:1.15rem;padding:10px 12px;text-align:center;word-break:break-word}
.opt.en2{direction:ltr;unicode-bidi:isolate}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.sound{font-size:1.6rem;background:var(--card);border:1px solid var(--line);border-radius:50%;width:64px;height:64px}
.big{font-size:3.2rem;font-weight:800;text-align:center;margin:2px 0;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.miss{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.miss b{direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.95rem;opacity:0;pointer-events:none;max-width:90vw;text-align:center;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">جارٍ التحميل…</p></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><div class="wrap"><p>هذه الصفحة تحتاج JavaScript لتعمل.</p></div></noscript>

<script>
(function(){
'use strict';
/* ===================== ثوابت ===================== */
const CFG={owner:'learner-2001',repo:'language-trainer',branch:'main'};
const $=id=>document.getElementById(id);
const app=$('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MODES=['recall','reverse','dictation','flash'];
const MODE_AR={recall:'استدعاء سريع',reverse:'ترجمة عكسية',dictation:'إملاء سمعي',flash:'قراءة سريعة'};
const MODE_ICON={recall:'⚡',reverse:'🔁',dictation:'🎧',flash:'👁️'};
const MODE_LETTER={recall:'r',reverse:'v',dictation:'d',flash:'f'};
const LETTER_MODE={r:'recall',v:'reverse',d:'dictation',f:'flash'};
const TY_AR={verb:'فعل',adjective:'صفة',phrasal:'فعل مركب',sentence:'جملة'};
const INTERVALS=[1,2,4,7,14,30];
const LIM_DEF={recall:6,reverse:7,dictation:9,flash:6};
const NEW_CYCLE=['word','verb','adjective','phrase','word','verb','adjective','phrasal','phrase','sentence'];
const LEVELS=['A1','A2','B1','B2','C1','C2'];
const lvCmp=(a,b)=>{const x=LEVELS.indexOf(a),y=LEVELS.indexOf(b);return (x<0?99:x)-(y<0?99:y)||(a<b?-1:a>b?1:0);};

let WORDS=null,PROG=null,PROG_ERR=null,quotaWarned=false,ALL=[],BYID=new Map(),POOL={},ALTS=new Map();
let sess=null,settingsOpen=false,impState=null,voiceEN=null,toastT=null;

/* ===================== أدوات صغيرة ===================== */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>window.__LT_TODAY||ymd(new Date());
function addDays(d,n){const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function sha1(msg){
  const rotl=(n,s)=>(n<<s)|(n>>>(32-s));
  const b=Array.from(new TextEncoder().encode(msg)),ml=b.length*8;
  b.push(0x80);while(b.length%64!==56)b.push(0);
  const hi=Math.floor(ml/0x100000000),lo=ml>>>0;
  for(let i=3;i>=0;i--)b.push((hi>>>(i*8))&255);
  for(let i=3;i>=0;i--)b.push((lo>>>(i*8))&255);
  let h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0;
  for(let i=0;i<b.length;i+=64){
    const w=new Array(80);
    for(let j=0;j<16;j++)w[j]=(b[i+4*j]<<24)|(b[i+4*j+1]<<16)|(b[i+4*j+2]<<8)|b[i+4*j+3];
    for(let j=16;j<80;j++)w[j]=rotl(w[j-3]^w[j-8]^w[j-14]^w[j-16],1);
    let a=h0,bb=h1,c=h2,d=h3,e=h4;
    for(let j=0;j<80;j++){
      let f,k;
      if(j<20){f=(bb&c)|(~bb&d);k=0x5A827999;}
      else if(j<40){f=bb^c^d;k=0x6ED9EBA1;}
      else if(j<60){f=(bb&c)|(bb&d)|(c&d);k=0x8F1BBCDC;}
      else{f=bb^c^d;k=0xCA62C1D6;}
      const t=(rotl(a,5)+f+e+k+w[j])|0;
      e=d;d=c;c=rotl(bb,30);bb=a;a=t;
    }
    h0=(h0+a)|0;h1=(h1+bb)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;
  }
  return [h0,h1,h2,h3,h4].map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const AR_MARKS=/[ً-ٰٟـ]/g;
function altsOf(t){return String(t).replace(AR_MARKS,'').split(/[\/،,]/).map(p=>p.replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[^؀-ۿa-zA-Z0-9\s]/g,'').replace(/\s+/g,' ').trim()).filter(Boolean);}
function overlap(a,b){for(const x of a)if(b.has(x))return true;return false;}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3800);}
function b64ToUtf8(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function utf8ToB64(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin);}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ===================== الصوت ===================== */
function ttsOK(){return 'speechSynthesis' in window&&typeof window.SpeechSynthesisUtterance!=='undefined';}
function initVoices(){if(!ttsOK())return;const load=()=>{try{const vs=speechSynthesis.getVoices()||[];voiceEN=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}};load();try{speechSynthesis.onvoiceschanged=load;}catch(e){}}
function speak(text){if(!ttsOK())return false;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voiceEN)u.voice=voiceEN;u.rate=0.9;speechSynthesis.speak(u);return true;}catch(e){return false;}}

/* ===================== GitHub ===================== */
const API=p=>`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${p}`;
const RAW=p=>`https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${p}`;
const token=()=>lsGet('lt_token');
function statusErr(s){const e=new Error('GitHub HTTP '+s);e.status=s;return e;}
function errMsg(e){
  if(e&&e.status===401)return 'المفتاح غير صالح أو منتهي. أدخل مفتاحاً جديداً من الإعدادات.';
  if(e&&(e.status===403||e.status===404))return 'المفتاح لا يملك صلاحية الكتابة على المستودع (يلزم Contents: Read and write).';
  if(e instanceof TypeError)return 'لا يوجد اتصال بالإنترنت.';
  return (e&&e.message)||'خطأ غير معروف';
}
async function pubJSON(path,fresh){
  const r=await fetch(RAW(path)+(fresh?'?t='+Date.now():''),fresh?{cache:'no-store'}:undefined);
  if(!r.ok)throw statusErr(r.status);
  return r.json();
}
async function ghFile(path,tok){
  const H=a=>({headers:{Authorization:'Bearer '+tok,Accept:a},cache:'no-store'});
  const u=API(path)+'?ref='+CFG.branch;
  const r=await fetch(u,H('application/vnd.github+json'));
  if(!r.ok)throw statusErr(r.status);
  const j=await r.json();
  if(j.encoding==='base64'&&j.content)return{sha:j.sha,text:b64ToUtf8(j.content)};
  const r2=await fetch(u,H('application/vnd.github.raw+json'));
  if(!r2.ok)throw statusErr(r2.status);
  return{sha:j.sha,text:await r2.text()};
}
function ghPut(path,text,sha,msg,tok){
  return fetch(API(path),{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},body:JSON.stringify({message:msg,content:utf8ToB64(text),sha,branch:CFG.branch})});
}

/* ===================== التقدّم ===================== */
function ensureShape(p){
  p.items=p.items||{};p.settings=p.settings||{sessionSize:30};p.sessions=p.sessions||[];
  if(!p.daily){
    const d={};
    for(const s of p.sessions){const x=d[s.date]=d[s.date]||{n:0,c:0,s:0};x.n+=s.n;x.c+=Math.round(s.acc*s.n);x.s+=1;}
    p.daily=d;
  }
  return p;
}
class AlreadyApplied extends Error{}
/* يجب أن تبقى مطابقة لـ tools/apply_results.py */
function applyToProgress(prog,code){
  code=code.trim();const parts=code.split('|');
  if(parts[0]!=='v2'||parts.length<3)throw new Error('صيغة الكود غير صحيحة');
  const date=parts[1];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw new Error('تاريخ الكود غير صحيح');
  ensureShape(prog);
  const h=sha1(code).slice(0,10);
  if(prog.sessions.some(s=>s.h===h))throw new AlreadyApplied('already applied');
  const entries=parts.slice(2).filter(Boolean).map(e=>{
    const f=e.split('.');
    if(f.length!==3||!/^[rvdf][01]$/.test(f[1])||!/^\d+$/.test(f[2]))throw new Error('جزء غير صحيح في الكود');
    return{id:f[0],mode:LETTER_MODE[f[1][0]],ok:f[1][1]==='1',ms:+f[2]*100};
  });
  if(!entries.length)throw new Error('الكود فارغ');
  const P=prog.items,S=prog.settings,by={};
  for(const e of entries){
    const p=P[e.id]=P[e.id]||{s:0,c:0,k:0,l:null,d:null,m:null,ms:0};
    p.s+=1;p.ms=Math.round((p.ms*(p.s-1)+e.ms)/p.s);
    if(e.ok){p.c+=1;p.k+=1;}else p.k=0;
    p.l=date;p.m=e.mode;p.d=addDays(date,INTERVALS[Math.min(p.k,5)]);
    const b=by[e.mode]=by[e.mode]||{n:0,c:0,ms:0};b.n++;b.c+=e.ok?1:0;b.ms+=e.ms;
  }
  const modes=Object.keys(by),stats={};
  let total=0,right=0;
  for(const m of modes){total+=by[m].n;right+=by[m].c;stats[m]={n:by[m].n,c:by[m].c,ms:Math.round(by[m].ms/by[m].n)};}
  let weakest=null;
  if(modes.length>1)weakest=modes.slice().sort((a,b)=>(stats[a].c/stats[a].n-stats[b].c/stats[b].n)||(stats[b].ms-stats[a].ms))[0];
  const limits=Object.assign({},LIM_DEF,S.limits||{});
  for(const m of modes){
    const b=stats[m];if(b.n<5)continue;
    const a=b.c/b.n;
    const prev=prog.sessions.filter(x=>x.byMode&&x.byMode[m]&&x.byMode[m].n>=5).map(x=>x.byMode[m]).slice(-2);
    if(a<0.6)limits[m]=Math.min(12,limits[m]+0.5);
    else if(a>=0.9&&prev.length===2&&prev.every(x=>x.c/x.n>=0.9))limits[m]=Math.max(3,limits[m]-0.5);
  }
  S.limits=limits;
  const dd=prog.daily[date]=prog.daily[date]||{n:0,c:0,s:0};
  dd.n+=total;dd.c+=right;dd.s+=1;
  prog.sessions.push({date,h,n:total,acc:Math.round(right/total*1000)/1000,byMode:stats,weakest});
  prog.sessions=prog.sessions.slice(-100);
  return prog;
}
function cacheProg(){
  if(!lsSet('lt_prog_cache',PROG)&&!quotaWarned){quotaWarned=true;toast('ذاكرة المتصفح ممتلئة فتعذّر حفظ تقدّمك على هذا الجهاز. نزّل نسخة احتياطية الآن من الإعدادات.');}
}
const dirty=()=>!!lsGet('lt_dirty');
const setDirty=v=>{if(v)lsSet('lt_dirty',1);else lsDel('lt_dirty');};
/* دمج تقدّمين: الأحدث يفوز لكل كلمة، وتُجمع الجلسات والأيام بلا تكرار. الأساس هو repo والمحلي يُضاف فوقه */
function mergeProgress(repo,local){
  const out=JSON.parse(JSON.stringify(ensureShape(repo))),L=ensureShape(JSON.parse(JSON.stringify(local)));
  for(const id in L.items){
    const a=out.items[id],b=L.items[id];
    if(!a||(b.l||'')>(a.l||'')||((b.l||'')===(a.l||'')&&b.s>a.s))out.items[id]=b;
  }
  const key=x=>x.h||(x.date+'|'+x.n+'|'+x.acc);
  const seen=new Set(out.sessions.map(key));let added=false;
  for(const x of L.sessions){if(!seen.has(key(x))){seen.add(key(x));out.sessions.push(x);added=true;}}
  if(added){out.sessions.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);out.sessions=out.sessions.slice(-100);}
  for(const d in L.daily){const a=out.daily[d],b=L.daily[d];if(!a||b.n>a.n)out.daily[d]=b;}
  const ls=L.settings||{};
  for(const k in ls){if(k==='limits'||(out.settings&&out.settings[k]!==undefined))continue;out.settings[k]=ls[k];}
  if(ls.limits)out.settings.limits=Object.assign({},out.settings.limits||{},ls.limits);
  return out;
}
/* التقدّم المحلي هو المرجع على هذا الجهاز. GitHub مزامنة اختيارية بين الأجهزة */
async function loadProgress(){
  PROG_ERR=null;
  const tok=token(),cache=lsGet('lt_prog_cache'),hasCache=!!(cache&&cache.items);
  if(!tok){
    if(hasCache)PROG=ensureShape(cache);
    else{try{PROG=ensureShape(await pubJSON('data/progress.json',true));}catch(e){PROG_ERR=e;PROG=ensureShape({});}}
    cacheProg();return;
  }
  try{
    const f=await ghFile('data/progress.json',tok);
    PROG=ensureShape(JSON.parse(f.text));
  }catch(e){
    PROG_ERR=e;
    let base=null;
    if(e.status===401||e.status===403||e.status===404){try{base=await pubJSON('data/progress.json',true);}catch(_){}}
    PROG=hasCache?(base?mergeProgress(base,cache):ensureShape(cache)):ensureShape(base||{});
    cacheProg();return;
  }
  if(dirty()&&hasCache)PROG=mergeProgress(PROG,cache);
  cacheProg();
}
function localApply(code){try{applyToProgress(PROG,code);cacheProg();}catch(e){}}
async function autosave(code){
  const tok=token();if(!tok)throw new Error('المزامنة غير مفعّلة');
  for(let attempt=0;attempt<4;attempt++){
    const f=await ghFile('data/progress.json',tok);
    const prog=JSON.parse(f.text);
    try{applyToProgress(prog,code);}
    catch(e){if(e instanceof AlreadyApplied){PROG=ensureShape(prog);cacheProg();return 'already';}throw e;}
    const r=await ghPut('data/progress.json',JSON.stringify(prog),f.sha,'Session '+code.split('|')[1],tok);
    if(r.ok){PROG=prog;PROG_ERR=null;cacheProg();return 'saved';}
    if(r.status===409||r.status===422)continue;
    throw statusErr(r.status);
  }
  throw new Error('تعارض متكرر في الملف، حاول بعد قليل.');
}
/* يرسل كل ما على هذا الجهاز إلى GitHub (دمج). يُستعمل عند تفعيل المفتاح وبعد انقطاع الحفظ */
async function syncPush(){
  const tok=token();if(!tok)throw new Error('المزامنة غير مفعّلة');
  for(let attempt=0;attempt<4;attempt++){
    const f=await ghFile('data/progress.json',tok);
    const repo=ensureShape(JSON.parse(f.text));
    const merged=mergeProgress(repo,PROG);
    if(JSON.stringify(merged)===JSON.stringify(repo)){PROG=repo;PROG_ERR=null;cacheProg();setDirty(false);return 'same';}
    const r=await ghPut('data/progress.json',JSON.stringify(merged),f.sha,'Sync progress',tok);
    if(r.ok){PROG=merged;PROG_ERR=null;cacheProg();setDirty(false);return 'pushed';}
    if(r.status===409||r.status===422)continue;
    throw statusErr(r.status);
  }
  throw new Error('تعارض متكرر في الملف، حاول بعد قليل.');
}

/* ===================== الكلمات والفهرس ===================== */
function buildIndex(){
  BYID=new Map();POOL={};ALTS=new Map();ALL=WORDS.items;
  for(const it of ALL){ALTS.set(it.id,new Set(altsOf(it.tr)));BYID.set(it.id,it);(POOL[it.ty]=POOL[it.ty]||[]).push(it);}
}
function distractors(item,n){
  const out=[],taken=[ALTS.get(item.id)],lw=item.w.toLowerCase();
  const ok=c=>c.id!==item.id&&c.w.toLowerCase()!==lw&&taken.every(a=>!overlap(a,ALTS.get(c.id)))&&!out.some(o=>o.w.toLowerCase()===c.w.toLowerCase());
  for(const pool of [POOL[item.ty]||[],ALL]){
    let tries=0;
    while(out.length<n&&tries<800&&pool.length){tries++;const c=pool[Math.floor(Math.random()*pool.length)];if(ok(c)){out.push(c);taken.push(ALTS.get(c.id));}}
    if(out.length>=n)break;
  }
  return out;
}

/* ===================== خطة الجلسة ===================== */
function makePlan(items,prog,date,size,hasTTS){
  const P=prog.items,S=prog.settings||{};
  const nth=((prog.daily&&prog.daily[date])||{s:0}).s+1;
  const id=nth===1?date:date+'#'+nth;
  const rnd=rng(hash32(id+':'+Object.keys(P).length));
  const limits=Object.assign({},LIM_DEF,S.limits||{});
  const acc=p=>p.s?p.c/p.s:0;
  const due=items.filter(i=>P[i.id]&&P[i.id].d&&P[i.id].d<=date);
  due.sort((a,b)=>{const pa=P[a.id],pb=P[b.id],wa=acc(pa)>=0.7,wb=acc(pb)>=0.7;if(wa!==wb)return wa?1:-1;return pa.d<pb.d?-1:pa.d>pb.d?1:0;});
  const chosen=due.slice(0,size);
  const dueN=chosen.length;
  if(chosen.length<size){
    const fresh=items.filter(i=>!P[i.id]);
    const levels=[...new Set(fresh.map(i=>i.lv))].sort(lvCmp);
    for(const lv of levels){
      if(chosen.length>=size)break;
      const buckets={};
      for(const i of fresh)if(i.lv===lv)(buckets[i.ty]=buckets[i.ty]||[]).push(i);
      Object.values(buckets).forEach(b=>shuffle(b,rnd));
      let k=0,stall=0;
      while(chosen.length<size&&Object.values(buckets).some(b=>b.length)){
        const ty=NEW_CYCLE[k%NEW_CYCLE.length];k++;
        if(buckets[ty]&&buckets[ty].length){chosen.push(buckets[ty].pop());stall=0;}
        else if(++stall>=NEW_CYCLE.length){const b=Object.values(buckets).find(x=>x.length);chosen.push(b.pop());stall=0;}
      }
    }
  }
  if(chosen.length<size){
    const have=new Set(chosen.map(i=>i.id));
    const rest=items.filter(i=>P[i.id]&&!have.has(i.id));
    rest.sort((a,b)=>((P[a.id].l||'')<(P[b.id].l||'')?-1:(P[a.id].l||'')>(P[b.id].l||'')?1:0));
    chosen.push(...rest.slice(0,size-chosen.length));
  }
  const allowedAll=MODES.filter(m=>m!=='dictation'||hasTTS);
  const counts={};allowedAll.forEach(m=>counts[m]=0);
  const assigned=chosen.map(it=>{
    let allowed=allowedAll.filter(m=>!(m==='flash'&&it.ty==='sentence'));
    const last=(P[it.id]||{}).m;
    if(allowed.includes(last)&&allowed.length>1)allowed=allowed.filter(m=>m!==last);
    const low=Math.min(...allowed.map(m=>counts[m]));
    const cand=allowed.filter(m=>counts[m]===low);
    const m=cand[Math.floor(rnd()*cand.length)];counts[m]++;
    return[it,m];
  });
  shuffle(assigned,rnd);
  const ordered=[];
  while(assigned.length){
    const prev=ordered[ordered.length-1],pm=prev&&prev[1],pt=prev&&prev[0].ty;
    const rem={};assigned.forEach(a=>{rem[a[1]]=(rem[a[1]]||0)+1;});
    const top=Object.keys(rem).sort((a,b)=>rem[b]-rem[a])[0];
    const must=top!==pm&&rem[top]*2>=assigned.length?top:null;
    const okm=a=>a[1]!==pm&&(!must||a[1]===must);
    let idx=assigned.findIndex(a=>okm(a)&&a[0].ty!==pt);
    if(idx<0)idx=assigned.findIndex(okm);
    if(idx<0)idx=assigned.findIndex(a=>a[1]!==pm);
    if(idx<0)idx=0;
    ordered.push(assigned.splice(idx,1)[0]);
  }
  const q=ordered.map(([it,m])=>({id:it.id,mode:m,t:limits[m]+(it.ty==='sentence'?3:(it.ty==='phrase'&&it.w.split(' ').length>=3?1:0))}));
  return{id,date,q,flashMs:window.__LT_FLASH_MS||800,dueN,newN:chosen.filter(i=>!P[i.id]).length};
}

/* ===================== إحصاءات الواجهة ===================== */
function stagesOf(items,P){const s={n:0,l:0,s:0,m:0};for(const it of items){const p=P[it.id];if(!p||!p.s)s.n++;else if(p.k>=4)s.m++;else if(p.k>=2)s.s++;else s.l++;}return s;}
function streakOf(daily,date){let d=(daily[date]&&daily[date].n>0)?date:addDays(date,-1);let n=0;while(daily[d]&&daily[d].n>0){n++;d=addDays(d,-1);}return n;}
function acc7Of(daily,date){let n=0,c=0;for(let i=0;i<7;i++){const x=daily[addDays(date,-i)];if(x){n+=x.n;c+=x.c;}}return n?Math.round(c/n*100):null;}

/* ===================== استيراد الكلمات ===================== */
function cleanTr(t){return String(t).replace(/\s+([ً-ٰٟ])/g,'$1').replace(AR_MARKS,'').replace(/’/g,"'").replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').replace(/^[\s.،]+|[\s.،]+$/g,'');}
const nwOf=w=>w.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
function slugOf(k){const s=k.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');return s||hash32(k).toString(16);}
function parseImport(text){
  const rows=[],bad=[];
  for(let line of String(text).split(/\r?\n/)){
    line=line.trim();
    if(!line||line[0]==='#')continue;
    line=line.replace(/\*+/g,'').replace(/^\d+[\.\)]\s+/,'').trim();
    let w,tr,m;
    if(line.includes('\t')){const p=line.split('\t').map(x=>x.trim()).filter(Boolean);w=p[0];tr=p.slice(1).join(' / ');}
    else if((m=line.match(/^(.+?)\s+[—–\-]+\s+(.+)$/))){w=m[1];tr=m[2];}
    else if((m=line.match(/^([^=:：]+?)\s*[=:：]\s*(.+)$/))){w=m[1];tr=m[2];}
    else{const i=line.search(/[؀-ۿ]/);if(i>0){w=line.slice(0,i);tr=line.slice(i);}}
    if(!w||!tr){bad.push(line);continue;}
    tr=tr.replace(/^[—–\-:=\s]+/,'').trim();
    w=w.replace(/^["'“”‘’\s]+|["'“”‘’\s]+$/g,'').replace(/\s+/g,' ').trim();
    let cj=null;const mc=tr.match(/\s*[\(\[]([A-Za-z,\s'’\/\-–—]+)[\)\]]\s*$/);
    if(mc){cj=mc[1].trim();tr=tr.slice(0,mc.index).trim();}
    if(!/[A-Za-z]/.test(w)||!/[؀-ۿ]/.test(tr)||w.length>90||tr.length>140){bad.push(line);continue;}
    rows.push({w,tr,cj});
  }
  return{rows,bad};
}
function mergeInto(words,rows,level,tyForce){
  const items=words.items,byNw=new Map(),ids=new Set(),owner=new Map();
  for(const it of items){
    const k=nwOf(it.w);(byNw.get(k)||byNw.set(k,[]).get(k)).push(it);ids.add(it.id);
    const base=it.id.replace(/^en:/,'').replace(/~\d+$/,'');if(!owner.has(base))owner.set(base,k);
  }
  const res={added:0,merged:0,extended:0};
  for(const r of rows){
    const key=nwOf(r.w),tr=cleanTr(r.tr),a=new Set(altsOf(tr)),group=byNw.get(key)||[];
    const target=group.find(it=>overlap(new Set(altsOf(it.tr)),a));
    if(target){
      const have=new Set(altsOf(target.tr));
      const extra=tr.split('/').map(s=>s.trim()).filter(s=>s&&altsOf(s).length&&!have.has(altsOf(s)[0]));
      if(extra.length){target.tr+=' / '+extra.join(' / ');res.extended++;}
      const src=level+'-import';if(!target.src.includes(src))target.src.push(src);
      if(!target.cj&&r.cj)target.cj=r.cj;
      res.merged++;continue;
    }
    let s=slugOf(key);const o=owner.get(s);
    if(o!==undefined&&o!==key)s+='-'+hash32(key).toString(16).slice(0,4);
    owner.set(s,key);
    let n=group.length+1,id='en:'+s+(n===1?'':'~'+n);
    while(ids.has(id)){n++;id='en:'+s+'~'+n;}
    const ty=tyForce||(/[?.!]$/.test(r.w)?'sentence':(r.w.includes(' ')?'phrase':'word'));
    const it={id,w:r.w,tr,ty,lv:level,src:[level+'-import']};
    if(r.cj)it.cj=r.cj;
    items.push(it);ids.add(id);group.push(it);byNw.set(key,group);res.added++;
  }
  words.levels=[...new Set([...(words.levels||[]),level])].sort(lvCmp);
  return res;
}

  else plan=makePlan(ALL,PROG,today(),size,ttsOK());
  if(!plan.q.length){toast('لا توجد أسئلة متاحة الآن.');return;}
  sess={plan,i:0,res:[],tok:0,timer:null,locked:false,practice:!!practice,screen:'q'};
  showQ();
}
function clearTimer(){if(sess&&sess.timer){clearInterval(sess.timer);sess.timer=null;}}

function showQ(){
  clearTimer();
  const q=sess.plan.q[sess.i];
  if(!q)return finish();
  const item=BYID.get(q.id);
  if(!item){sess.res[sess.i]={id:q.id,mode:q.mode,s:1,c:0,ms:0};sess.i++;return showQ();}
  let mode=q.mode,note='';
  if(mode==='dictation'&&!ttsOK()){mode='recall';note='الصوت غير مدعوم هنا، حُوّل هذا السؤال إلى استدعاء سريع.';}
  if(mode==='flash'&&item.ty==='sentence')mode='recall';
  sess.cur=q;sess.item=item;sess.mode=mode;sess.locked=false;sess.tok++;sess.screen='q';
  const tok=sess.tok,total=sess.plan.q.length,rev=mode==='reverse';
  const opts=shuffle([item].concat(distractors(item,3)),Math.random);
  sess.correctIdx=opts.indexOf(item);
  const tag=TY_AR[item.ty]?`<span class="tag">${TY_AR[item.ty]}</span>`:'';
  let prompt;
  if(rev)prompt=`<div class="ar">${esc(item.tr)}</div><div class="mute">اختر الكلمة الإنجليزية</div>`;
  else if(mode==='dictation')prompt=`<button class="sound" data-act="again" aria-label="أعد الاستماع">🔊</button><div class="mute">استمع ثم اختر المعنى</div>`;
  else if(mode==='flash')prompt=`<div class="en" id="flashw">${esc(item.w)}</div>${tag}`;
  else prompt=`<div class="en">${esc(item.w)}</div>${tag}`;
  app.innerHTML=`<div class="top"><button data-act="quit">إنهاء</button><span class="badge">${sess.i+1} / ${total}</span><span class="badge">${MODE_ICON[mode]} ${MODE_AR[mode]}</span></div>
    <div class="bar"><i id="bar"></i></div>${note?`<div class="warnbox">${esc(note)}</div>`:''}
    <div class="card prompt" id="prompt">${prompt}</div>
    <div class="opts" id="opts" style="${mode==='flash'?'visibility:hidden':''}">${opts.map((o,k)=>`<button class="opt${rev?' en2':''}" data-act="ans" data-k="${k}">${esc(rev?o.w:o.tr)}</button>`).join('')}</div>`;
  const startTimer=()=>{
    const t=q.t||6,t0=performance.now();sess.t0=t0;
    const bar=$('bar');
    sess.timer=setInterval(()=>{
      if(tok!==sess.tok){clearInterval(sess.timer);return;}
      const el=(performance.now()-t0)/1000,left=Math.max(0,1-el/t);
      if(bar){bar.style.width=(left*100)+'%';if(left<=0.25)bar.classList.add('low');}
      if(el>=t)onTimeout(tok);
    },100);
  };
  if(mode==='dictation'){speak(item.w);startTimer();}
  else if(mode==='flash'){
    setTimeout(()=>{
      if(tok!==sess.tok)return;
      const fw=$('flashw');if(fw)fw.textContent='؟';
      const o=$('opts');if(o)o.style.visibility='visible';
      startTimer();
    },sess.plan.flashMs||800);
  }else startTimer();
}
function mark(c,p){document.querySelectorAll('#opts .opt').forEach((b,k)=>{b.classList.add(k===c?'ok':k===p?'bad':'dim');});}
function record(r){sess.res[sess.i]=Object.assign({id:sess.cur.id,mode:sess.mode,s:0,c:0,ms:0},r);}
function advance(delay,tok){setTimeout(()=>{if(!sess||tok!==sess.tok)return;sess.i++;showQ();},delay);}
function onAnswer(k){
  if(!sess||sess.locked||sess.screen!=='q')return;
  const tok=sess.tok;sess.locked=true;clearTimer();
  const ms=Math.round(performance.now()-sess.t0),ok=k===sess.correctIdx;
  record({c:ok?1:0,ms});mark(sess.correctIdx,k);if(!ok)vibrate(60);
  advance(ok?400:1300,tok);
}
function onTimeout(tok){
  if(!sess||sess.locked||tok!==sess.tok)return;
  sess.locked=true;clearTimer();
  record({c:0,ms:Math.round((sess.cur.t||6)*1000),to:1});mark(sess.correctIdx,-1);vibrate(60);
  advance(1300,tok);
}

function finish(){
  clearTimer();sess.screen='sum';
  const plan=sess.plan;
  for(let i=0;i<plan.q.length;i++)if(!sess.res[i])sess.res[i]={id:plan.q[i].id,mode:plan.q[i].mode,s:1,c:0,ms:0};
  const done=sess.res.filter(r=>!r.s),right=done.filter(r=>r.c).length;
  const acc=done.length?Math.round(right/done.length*100):0;
  const avgMs=done.length?done.reduce((a,r)=>a+r.ms,0)/done.length:0;
  const by={};done.forEach(r=>{const m=by[r.mode]=by[r.mode]||{n:0,c:0,ms:0};m.n++;m.c+=r.c;m.ms+=r.ms;});
  const modes=Object.keys(by).map(m=>({m,n:by[m].n,acc:Math.round(by[m].c/by[m].n*100),avg:by[m].ms/by[m].n/1000}));
  const weakest=modes.length>1?modes.slice().sort((a,b)=>a.acc-b.acc||b.avg-a.avg)[0]:null;
  const missed=done.filter(r=>!r.c).map(r=>BYID.get(r.id)).filter(Boolean);
  const title=sess.practice?'انتهت جولة التصحيح':'انتهت الرحلة';
  if(!done.length){app.innerHTML=`<h1>${title}</h1><div class="card"><div class="mute">لم تُجب عن أي سؤال، فلم يُحفظ شيء.</div></div><button class="btn primary" data-act="back">الرجوع للرئيسية</button>`;return;}
  let cmp='';
  if(!sess.practice){
    const prev=PROG.sessions[PROG.sessions.length-1];
    if(prev&&prev.byMode){
      let pn=0,pms=0;for(const m in prev.byMode){pn+=prev.byMode[m].n;pms+=prev.byMode[m].ms*prev.byMode[m].n;}
      const pAcc=Math.round(prev.acc*100),dAvg=avgMs/1000-(pn?pms/pn/1000:0);
      cmp=`<div class="mute" style="text-align:center">الجلسة السابقة: دقة ${pAcc}%، ${dAvg<-0.05?'وأنت الآن أسرع بـ '+Math.abs(dAvg).toFixed(1)+' ث':dAvg>0.05?'وأنت الآن أبطأ بـ '+dAvg.toFixed(1)+' ث':'وبنفس السرعة تقريباً'}.</div>`;
    }
  }
  const rowsHtml=modes.sort((a,b)=>a.m.localeCompare(b.m)).map(x=>`<div class="row"><span>${MODE_ICON[x.m]} ${MODE_AR[x.m]}</span><span>${x.acc}% <span class="mute">(${x.avg.toFixed(1)} ث)</span></span></div>`).join('');
  const missHtml=missed.length?`<div class="card"><h2>كلمات أخطأت فيها (${missed.length})</h2>${missed.map(w=>`<div class="miss"><b>${esc(w.w)}</b><span>${esc(w.tr)}</span></div>`).join('')}</div>`:'';
  let saveCard='',code='';
  if(!sess.practice){
    code=['v2',today()].concat(done.map(r=>r.id+'.'+MODE_LETTER[r.mode]+(r.c?'1':'0')+'.'+Math.round(r.ms/100))).join('|');
    window.__LT_LASTCODE=code;
    saveCard=`<div class="card"><h2>حفظ التقدّم</h2><div class="mute" id="savemsg">${token()?'جارٍ الحفظ في GitHub…':'تم حفظ تقدّمك على هذا الجهاز ✓'}</div></div>`;
  }
  app.innerHTML=`<h1>${title}</h1>
    <div class="card"><div class="big">${acc}%</div><div class="mute" style="text-align:center">${right} صحيحة من ${done.length}، ومتوسط الزمن ${(avgMs/1000).toFixed(1)} ث${done.length<plan.q.length?`، و${plan.q.length-done.length} متروكة`:''}</div>${cmp}</div>
    <div class="card"><h2>حسب نوع التمرين</h2>${rowsHtml}${weakest?`<div class="warnbox">أضعف نوع عندك: ${MODE_ICON[weakest.m]} ${MODE_AR[weakest.m]} (${weakest.acc}%)</div>`:''}</div>
    ${missHtml}${saveCard}
    ${missed.length?`<button class="btn" data-act="retry">أعد الكلمات الخاطئة (${missed.length}) الآن</button>`:''}
    ${sess.practice?'':`<button class="btn go" id="nextbtn" data-act="next" disabled>جاهز؟ رحلة أخرى</button>`}
    <button class="btn" data-act="back">الرجوع للرئيسية</button>`;
  sess.missed=missed;
  if(sess.practice)return;
  const nb=$('nextbtn'),sm=$('savemsg');
  localApply(code);
  if(!token()){nb.disabled=false;return;}
  const bad=e=>e&&(e.status===401||e.status===403||e.status===404);
  (dirty()?syncPush():autosave(code))
    .then(r=>{setDirty(false);sm.textContent=r==='already'?'تقدّمك محفوظ مسبقاً ✓':'تم حفظ تقدّمك في GitHub ✓';nb.disabled=false;})
    .catch(e=>{setDirty(true);sm.textContent='لم يصل التقدّم إلى GitHub: '+errMsg(e)+' تقدّمك محفوظ على هذا الجهاز ولن يضيع، '+(bad(e)?'وسيُرسل بعد تجديد المفتاح من الإعدادات.':'وسيُرسل تلقائياً عند عودة الاتصال.');nb.disabled=false;});
}

/* ===================== التفاعل ===================== */
async function copyText(t,areaId){
  try{await navigator.clipboard.writeText(t);return true;}
  catch(e){const ta=$(areaId);if(ta){ta.select();try{return document.execCommand('copy');}catch(_){}}return false;}
}
async function setToken(){
  settingsOpen=true;
  const m=$('tokmsg'),t=$('tokin').value.trim();
  if(t.length<20){m.textContent='المفتاح قصير جداً. تأكد أنك نسخته كاملاً.';return;}
  m.textContent='جارٍ التحقق…';
  try{
    await ghFile('data/progress.json',t);
    lsSet('lt_token',t);
    try{await syncPush();toast('تم تفعيل المزامنة.');}
    catch(e){setDirty(true);toast('فُعّلت المزامنة لكن تعذّر الإرسال الآن: '+errMsg(e));}
    home();
  }catch(e){m.textContent=(e.status===401||e.status===403||e.status===404)?'GitHub لم يقبل هذا المفتاح ('+e.status+'). تأكد أنه للمستودع language-trainer وبصلاحية Contents: Read and write.':'تعذّر الاتصال بـ GitHub: '+errMsg(e);}
}
function bkDownload(){
  const data=JSON.stringify({app:'gate-backup',v:2,saved:today(),prog:PROG});
  try{
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download='gate-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    lsSet('lt_backup_at',today());settingsOpen=true;home();toast('تم تنزيل النسخة. احتفظ بها في مكان آمن.');
  }catch(e){
    settingsOpen=true;const m=$('bkmsg');if(!m)return;
    m.innerHTML=`<div class="mute">تعذّر التنزيل في هذا المتصفح. انسخ النص أدناه واحفظه في ملف.</div><textarea id="bktxt" class="ta code" readonly>${esc(data)}</textarea><button class="btn small" data-act="copy" data-target="bktxt">انسخ النص</button>`;
    lsSet('lt_backup_at',today());
  }
}
function bkRestore(file){
  settingsOpen=true;
  const fr=new FileReader();
  fr.onload=async()=>{
    const m=$('bkmsg');
    try{
      const j=JSON.parse(String(fr.result));
      if(!j||j.app!=='gate-backup'||!j.prog||typeof j.prog.items!=='object'||!Array.isArray(j.prog.sessions))throw new Error('هذا ليس ملف نسخة احتياطية من بوابة الانطلاق.');
      const n=Object.keys(j.prog.items).length;
      PROG=mergeProgress(PROG,j.prog);cacheProg();
      if(token()){setDirty(true);try{await syncPush();}catch(e){}}
      home();toast('تم استرجاع النسخة ('+n+' كلمة متابَعة).');
    }catch(e){if(m)m.textContent=(e instanceof SyntaxError)?'الملف تالف أو ليس نسخة احتياطية.':e.message;}
  };
  fr.onerror=()=>{const m=$('bkmsg');if(m)m.textContent='تعذّرت قراءة الملف.';};
  fr.readAsText(file);
}
function impPreview(){
  settingsOpen=true;
  const out=$('impout'),lv=$('implv').value,ty=$('impty').value;
  const {rows,bad}=parseImport($('impta').value);
  if(!rows.length){impState=null;out.innerHTML=`<div class="warnbox">لم أجد أي سطر صالح. الصيغة المطلوبة: word — المعنى.</div>${bad.length?`<div class="mute">أول سطر مرفوض: ${esc(bad[0])}</div>`:''}`;return;}
  const trial=JSON.parse(JSON.stringify({levels:WORDS.levels,items:WORDS.items}));
  const res=mergeInto(trial,rows,lv,ty);
  impState={rows,lv,ty};
  out.innerHTML=`<div class="okbox">${rows.length} سطراً صالحاً: <b>${res.added}</b> كلمة جديدة، و<b>${res.merged}</b> مكررة ستندمج مع كلمات موجودة${res.extended?` (أُضيفت لها معانٍ جديدة في ${res.extended})`:''}.</div>
    ${bad.length?`<div class="warnbox">${bad.length} سطراً لم أفهمه وسيُتجاهل. مثال: ${esc(bad[0])}</div>`:''}
    <button class="btn small primary" data-act="imp-commit"${res.added?'':' disabled'}>أضف ${res.added} كلمة إلى المستوى ${lv}</button>`;
}
async function impCommit(){
  const st=impState;if(!st)return;
  settingsOpen=true;const out=$('impout'),tok=token();
  out.innerHTML='<div class="mute">جارٍ الإضافة…</div>';
  try{
    for(let attempt=0;attempt<3;attempt++){
      const f=await ghFile('data/words.json',tok);
      const words=JSON.parse(f.text),res=mergeInto(words,st.rows,st.lv,st.ty);
      const r=await ghPut('data/words.json',JSON.stringify(words),f.sha,'Import words ('+st.lv+')',tok);
      if(r.ok){WORDS=words;buildIndex();impState=null;home();toast('أُضيفت '+res.added+' كلمة جديدة إلى المستوى '+st.lv+'.');return;}
      if(r.status===409||r.status===422)continue;
      throw statusErr(r.status);
    }
    throw new Error('تعارض متكرر، حاول بعد قليل.');
  }catch(e){out.innerHTML=`<div class="warnbox">${esc(errMsg(e))}</div>`;}
}
app.addEventListener('change',e=>{if(e.target&&e.target.id==='bkfile'&&e.target.files&&e.target.files[0])bkRestore(e.target.files[0]);});
app.addEventListener('toggle',e=>{if(e.target&&e.target.id==='settings')settingsOpen=e.target.open;},true);
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const v=b.dataset.v,a=b.dataset.act;
  switch(a){
    case 'start':startSession();break;
    case 'next':startSession();break;
    case 'retry':startSession(sess&&sess.missed);break;
    case 'back':home();break;
    case 'reload':boot();break;
    case 'size':lsSet('lt_size',+v);home();break;
    case 'goal':settingsOpen=true;lsSet('lt_goal',+v);home();break;
    case 'ans':onAnswer(+b.dataset.k);break;
    case 'again':if(sess&&sess.item)speak(sess.item.w);break;
    case 'quit':if(confirm('إنهاء الجلسة الآن؟ الأسئلة المتبقية تُحتسب «متروكة».')){clearTimer();sess.tok++;finish();}break;
    case 'snd':{settingsOpen=true;const m=$('sndmsg');if(!ttsOK()){m.textContent='الصوت غير مدعوم في هذا المتصفح. جرّب Chrome.';break;}speak('Hello. This is a sound test.');m.textContent='إن سمعت الصوت فكل شيء تمام. وإن لم تسمع، ارفع مستوى الصوت أو جرّب متصفحاً آخر.';break;}
    case 'tokon':setToken();break;
    case 'tokoff':lsDel('lt_token');settingsOpen=true;home();break;
    case 'flush':syncPush().then(()=>{toast('تم الحفظ في GitHub ✓');home();}).catch(e=>toast('تعذّر الحفظ: '+errMsg(e)));break;
    case 'bk-download':bkDownload();break;
    case 'copy':{const ta=$(b.dataset.target);copyText(ta?ta.value:'',b.dataset.target).then(ok=>toast(ok?'تم النسخ ✓':'تعذّر النسخ، حدّد النص وانسخه يدوياً.'));break;}
    case 'imp-preview':impPreview();break;
    case 'imp-commit':impCommit();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=((e.target&&e.target.tagName)||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(sess&&sess.screen==='q'){
    if(/^[1-4]$/.test(e.key)){
      const o=$('opts');
      if(!sess.locked&&o&&o.style.visibility!=='hidden'){const bt=o.querySelector('.opt[data-k="'+(+e.key-1)+'"]');if(bt){bt.click();e.preventDefault();}}
    }else if((e.key==='r'||e.key==='R')&&sess.mode==='dictation'&&sess.item)speak(sess.item.w);
  }else if(!sess&&e.key==='Enter'){
    const s=$('start');if(s&&!(document.activeElement&&document.activeElement.tagName==='BUTTON'))s.click();
  }
});

/* ===================== الإقلاع ===================== */
async function boot(){
  app.innerHTML='<h1>بوابة الانطلاق</h1><p class="mute">جارٍ تحميل الكلمات…</p>';
  try{WORDS=await pubJSON('data/words.json',false);lsSet('lt_words_cache',WORDS);}
  catch(e){
    const c=lsGet('lt_words_cache');
    if(c&&Array.isArray(c.items)&&c.items.length)WORDS=c;
    else return fatal('تعذّر تحميل الكلمات ('+errMsg(e)+'). تأكد من الاتصال بالإنترنت ثم أعد المحاولة.');
  }
  buildIndex();initVoices();
  await loadProgress();
  home();
  if(token()&&dirty())syncPush().then(()=>{toast('تم حفظ جلسات كانت معلّقة');if(!sess)home();}).catch(()=>{});
}
window.__LT={mergeProgress,sha1,makePlan,parseImport,mergeInto,applyToProgress,altsOf,stagesOf,streakOf,acc7Of,ensureShape,cleanTr,cur:()=>sess&&sess.item?{t:sess.cur&&sess.cur.t,item:sess.item,mode:sess.mode,correctIdx:sess.correctIdx,i:sess.i,n:sess.plan.q.length,screen:sess.screen,locked:sess.locked}:null};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot();
})();
</script>
